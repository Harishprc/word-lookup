# Builds the Android APK and attaches it as a workflow artifact.
#
# No gradle-wrapper.jar is committed (it's a compiled binary — can't be
# authored as text; open android/ in Android Studio once and it
# regenerates it automatically on first sync, see android/README section
# in the root README.md). CI therefore installs Gradle directly via
# gradle/actions/setup-gradle and calls `gradle`, not `./gradlew`.
#
# Signing: a fixed keystore (repo secrets, base64-encoded) is required so
# every build shares one signing key — Android refuses to install an
# update over an app signed by a *different* key, and a freshly generated
# debug key changes on every CI run, which would force an uninstall (and
# lose the local word cache) on every release. See app/build.gradle.kts'
# `signingConfigs`. Falls back to debug signing if the secrets aren't set
# yet, so the workflow still runs green on a fresh clone.

name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Repo secrets are optional (fresh clone / fork has none) — the
      # release build type falls back to debug signing when unset. Set
      # WORDLOOKUP_KEYSTORE_B64 (base64 of the .jks), WORDLOOKUP_KEYSTORE_PASSWORD,
      # WORDLOOKUP_KEY_ALIAS, WORDLOOKUP_KEY_PASSWORD in repo Settings > Secrets.
      - name: Decode release keystore
        if: ${{ secrets.WORDLOOKUP_KEYSTORE_B64 != '' }}
        env:
          WORDLOOKUP_KEYSTORE_B64: ${{ secrets.WORDLOOKUP_KEYSTORE_B64 }}
        run: echo "$WORDLOOKUP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Run unit tests
        run: gradle :app:test --no-daemon

      - name: Build APK
        env:
          WORDLOOKUP_KEYSTORE_PATH: ${{ secrets.WORDLOOKUP_KEYSTORE_B64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          WORDLOOKUP_KEYSTORE_PASSWORD: ${{ secrets.WORDLOOKUP_KEYSTORE_PASSWORD }}
          WORDLOOKUP_KEY_ALIAS: ${{ secrets.WORDLOOKUP_KEY_ALIAS }}
          WORDLOOKUP_KEY_PASSWORD: ${{ secrets.WORDLOOKUP_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WordLookup-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
