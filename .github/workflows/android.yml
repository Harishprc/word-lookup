# Builds the Android APK and attaches it as a workflow artifact.
#
# No gradle-wrapper.jar is committed (it's a compiled binary — can't be
# authored as text; open android/ in Android Studio once and it
# regenerates it automatically on first sync, see android/README section
# in the root README.md). CI therefore installs Gradle directly via
# gradle/actions/setup-gradle and calls `gradle`, not `./gradlew`.
#
# Signing: a fixed keystore (repo secrets, base64-encoded) is required so
# every build shares one signing key — Android refuses to install an
# update over an app signed by a *different* key, and a freshly generated
# debug key changes on every CI run, which would force an uninstall (and
# lose the local word cache) on every release. See app/build.gradle.kts'
# `signingConfigs`. Falls back to debug signing if the secrets aren't set
# yet, so the workflow still runs green on a fresh clone.

name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    # Secrets are hoisted to job-level env because the `secrets` context is
    # NOT available in a step-level `if:` — GitHub rejects the entire
    # workflow file with "Unrecognized named-value: 'secrets'", which
    # surfaces as a run that fails with zero jobs and no checks on the PR.
    # The `env` context IS allowed there, so the optional-signing steps
    # below branch on these instead.
    env:
      WORDLOOKUP_KEYSTORE_B64: ${{ secrets.WORDLOOKUP_KEYSTORE_B64 }}
      WORDLOOKUP_KEYSTORE_PASSWORD: ${{ secrets.WORDLOOKUP_KEYSTORE_PASSWORD }}
      WORDLOOKUP_KEY_ALIAS: ${{ secrets.WORDLOOKUP_KEY_ALIAS }}
      WORDLOOKUP_KEY_PASSWORD: ${{ secrets.WORDLOOKUP_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Repo secrets are optional (fresh clone / fork has none) — the
      # release build type falls back to debug signing when unset. Set
      # WORDLOOKUP_KEYSTORE_B64 (base64 of the .jks), WORDLOOKUP_KEYSTORE_PASSWORD,
      # WORDLOOKUP_KEY_ALIAS, WORDLOOKUP_KEY_PASSWORD in repo Settings > Secrets.
      # Exports WORDLOOKUP_KEYSTORE_PATH for the build step below; when no
      # keystore secret is configured the variable stays unset and
      # app/build.gradle.kts falls back to debug signing.
      - name: Decode release keystore
        if: env.WORDLOOKUP_KEYSTORE_B64 != ''
        run: |
          echo "$WORDLOOKUP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "WORDLOOKUP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Output is tee'd so the failure step below can turn compiler/test
      # errors into GitHub annotations. Raw job logs need admin rights to
      # download, but annotations are readable from the public API — so
      # this is what makes a red build diagnosable without pasting logs
      # around. pipefail keeps gradle's exit code through the pipe.
      - name: Run unit tests
        run: |
          set -o pipefail
          gradle :app:test --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Surface Gradle errors as annotations
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/gradle-*.log; do
            [ -f "$f" ] || continue
            grep -E '^e: |^w: .*error|error:|FAILURE:|Caused by:|FAILED|Unresolved reference|Compilation error' "$f" \
              | head -40 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          done

      # Test reports explain a red :app:test far better than the console
      # tail; kept for the cases where the annotation grep isn't enough.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: WordLookup-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
